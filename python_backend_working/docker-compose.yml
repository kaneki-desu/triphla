version: '3.8'

services:
  backend:
    build: .
    container_name: triphla-backend
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DEBUG=false
      - FRONTEND_URL=http://localhost:3000
    volumes:
      - ./financial_planner_pdfs:/app/financial_planner_pdfs
      - ./.env:/app/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
